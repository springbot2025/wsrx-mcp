[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wsrx-mcp"
version = "0.1.0"
description = "MCP server that manages WebSocket Reflector X (wsrx) tunnels"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "wsrx", "websocket", "tunnel", "ctf", "port-forwarding"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Networking",
]
dependencies = ["mcp>=1.2.0"]

[project.urls]
Homepage = "https://github.com/springbot2025/wsrx-mcp"

[project.scripts]
wsrx-mcp = "wsrx_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wsrx_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
